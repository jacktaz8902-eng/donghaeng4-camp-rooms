<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="5기 방배정">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>동행캠프 5기 방배정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 폰 한 손 조작용 단일 컬럼 — 상단 고정 검색바, 아래로 결과 카드, 탭하면 하단 시트로 같은 방 사람들 */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#e8ece6; --line:#d6ddd3;
  --fg:#18211b; --muted:#5b6a5f; --accent:#1f5a3d; --accent-ink:#ffffff; --accent-soft:#dcebe1;
  --warn:#b4382b; --male:#2e5d8a; --female:#a3466b;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#18201b; --surface-2:#212b24; --line:#2e3a32;
  --fg:#e7ede8; --muted:#97a69b; --accent:#6fc196; --accent-ink:#0d1a12; --accent-soft:#1f3529;
  --warn:#ef8a7d; --male:#86b3df; --female:#e59ab8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201b; --surface-2:#212b24; --line:#2e3a32;
  --fg:#e7ede8; --muted:#97a69b; --accent:#6fc196; --accent-ink:#0d1a12; --accent-soft:#1f3529;
  --warn:#ef8a7d; --male:#86b3df; --female:#e59ab8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- 잠금 화면 ---------- */
#lock{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-block:32px}
.lock-head{display:grid;gap:4px;margin-bottom:24px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.lock-head h1{font-size:26px;margin:0;text-wrap:balance}
.lock-head p{margin:0;color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:12px 8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.dots{display:flex;justify-content:center;gap:16px;margin:28px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.lock-msg{text-align:center;min-height:22px;font-size:14px;color:var(--muted)}
.lock-msg.err{color:var(--warn);font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pad button{border:0;background:var(--surface);border-radius:var(--r);height:62px;font-size:24px;font-family:var(--mono);font-weight:500;box-shadow:0 1px 0 var(--line)}
.pad button:active{background:var(--accent-soft)}
.pad .fn{font-family:var(--font);font-size:15px;color:var(--muted);background:transparent;box-shadow:none}
.lock-note{margin-top:20px;font-size:12px;color:var(--muted);text-align:center}

/* ---------- 앱 ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar .t{flex:1;min-width:0}
.bar h1{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.mode.mgr{background:var(--accent);color:var(--accent-ink)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;white-space:nowrap}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:14px 44px 14px 44px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--fg);-webkit-appearance:none}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.sep{border:0;background:transparent;padding:6px 2px;color:var(--line)}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-bottom:2px solid transparent;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

main{padding-block:12px 40px}
.count{font-size:13px;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.person{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.roomtag{flex:none;width:56px;height:56px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-content:center;text-align:center;line-height:1}
.roomtag b{font-family:var(--mono);font-size:24px;font-weight:600}
.roomtag small{font-size:10px;font-weight:600;margin-top:3px;letter-spacing:.04em}
.pinfo{flex:1;min-width:0}
.pname{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px}
.g{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;border:1px solid currentColor}
.g.m{color:var(--male)} .g.f{color:var(--female)}
.porg{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pphone{font-size:14px;margin-top:2px;user-select:all;-webkit-user-select:all}
mark{background:transparent;color:var(--accent);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.acts{display:flex;gap:6px;flex:none}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none}
.ic.call{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:12px}

.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:grid;gap:6px;align-content:start}
.rcard .rh{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.rcard .rn{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--accent)}
.rcard .rn small{font-family:var(--font);font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.rcard .rm{font-size:12px;color:var(--muted)}
.rcard .names{font-size:14px;line-height:1.6}

/* ---------- 하단 시트 ---------- */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:86%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgb(0 0 0 / .2)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 0}
.sheet header .t{flex:1;min-width:0}
.sheet h2{margin:0;font-size:22px}
.sheet h2 .num{color:var(--accent)}
.sheet .meta{font-size:13px;color:var(--muted)}
.sheet .body{overflow-y:auto;padding-bottom:16px}
.sheet .person{border-radius:12px}
.sheet .person.me{border-color:var(--accent);border-width:2px}
.sheet .person .roomtag{display:none}
.sheet-foot{display:flex;gap:8px;padding:4px 0 12px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;font-size:14px;text-align:center;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;white-space:nowrap}
.busy{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

</head>

<!-- 잠금 화면 -->
<section id="lock" class="wrap" aria-label="비밀번호 입력">
  <div class="lock-head">
    <span class="eyebrow">ROOM FINDER</span>
    <h1>동행캠프 5기 방배정</h1>
    <p>옥순봉 트레킹 · 11.12(목)~13(금) · 소노벨 단양</p>
  </div>
  <div class="seg" role="group" aria-label="사용자 구분">
    <button id="m-pub" type="button" aria-pressed="true">참여자</button>
    <button id="m-mgr" type="button" aria-pressed="false">매니저</button>
  </div>
  <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="lock-msg" id="lockMsg" role="status">비밀번호 4자리를 눌러주세요</div>
  <div class="pad" id="pad">
    <button type="button">1</button><button type="button">2</button><button type="button">3</button>
    <button type="button">4</button><button type="button">5</button><button type="button">6</button>
    <button type="button">7</button><button type="button">8</button><button type="button">9</button>
    <button type="button" class="fn" data-k="clr">전체 지움</button><button type="button">0</button><button type="button" class="fn" data-k="del" aria-label="한 자리 지우기">⌫</button>
  </div>
  <p class="lock-note">명단은 암호화되어 있어 비밀번호를 입력해야 열립니다.</p>
</section>

<!-- 앱 -->
<div id="app" hidden>
  <div class="top">
    <div class="wrap">
      <div class="bar">
        <div class="t"><h1 id="evTitle">동행캠프 5기 방배정</h1><div class="sub" id="evSub"></div></div>
        <span class="mode" id="modeTag">참여자</span>
        <button class="ghost" id="lockBtn" type="button">잠금</button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="이름 · 초성(ㄱㅁㅇ) · 호실(720)">
        <button class="clear" id="clr" type="button" aria-label="검색어 지우기" hidden>×</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="필터"></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-p" aria-selected="true" type="button">사람별</button>
        <button role="tab" id="tab-r" aria-selected="false" type="button">방별</button>
      </div>
    </div>
  </div>
  <main class="wrap" id="main"></main>
</div>

<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <div class="grab"></div>
  <div class="wrap" style="display:flex;flex-direction:column;min-height:0;flex:1;width:100%">
    <header>
      <div class="t"><h2 id="shTitle"></h2><div class="meta" id="shMeta"></div></div>
      <button class="ghost" id="shClose" type="button">닫기</button>
    </header>
    <div class="body" id="shBody"></div>
    <div class="sheet-foot" id="shFoot"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

  sms:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
};

/* ---------- 복호화 ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openVault(box, pin){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(box.s), iterations:box.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(box.i)}, key, b64(box.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- 잠금 화면 ---------- */
let mode = 'pub', pin = '', busy = false;
function setMode(m){
  mode = m; pin = ''; drawDots();
  $('#m-pub').setAttribute('aria-pressed', m==='pub');
  $('#m-mgr').setAttribute('aria-pressed', m==='mgr');
  msg(m==='mgr' ? '매니저 비밀번호 4자리' : '참여자 비밀번호 4자리');
}
function msg(t, err){ const el=$('#lockMsg'); el.innerHTML=t; el.classList.toggle('err', !!err); }
function drawDots(){ [...$('#dots').children].forEach((d,i)=>d.classList.toggle('on', i<pin.length)); }
async function press(k){
  if (busy) return;
  if (k==='del') pin = pin.slice(0,-1);
  else if (k==='clr') pin = '';
  else if (/^\d$/.test(k) && pin.length<4) pin += k;
  drawDots();
  if (pin.length===4){
    busy = true; msg('<span class="busy"></span>여는 중…');
    try { const data = await openVault(VAULT[mode], pin); start(data, mode); }
    catch(e){
      const d=$('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
      msg(mode==='pub' ? '비밀번호가 맞지 않아요. 매니저라면 위에서 ‘매니저’를 고르세요.' : '비밀번호가 맞지 않아요. 다시 눌러주세요.', true);
      pin=''; drawDots();
    }
    busy = false;
  }
}
$('#pad').addEventListener('click', e => { const b=e.target.closest('button'); if(b) press(b.dataset.k || b.textContent.trim()); });
$('#m-pub').onclick = () => setMode('pub');
$('#m-mgr').onclick = () => setMode('mgr');
document.addEventListener('keydown', e => {
  if ($('#lock').hidden) return;
  if (/^\d$/.test(e.key)) press(e.key); else if (e.key==='Backspace') press('del');
});

/* ---------- 검색 유틸 ---------- */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho = s => [...s].map(ch => { const c=ch.charCodeAt(0)-0xAC00; return (c>=0 && c<11172) ? CHO[Math.floor(c/588)] : ch; }).join('');
const isCho = s => /^[ㄱ-ㅎ]+$/.test(s);
const digits = s => s.replace(/\D/g,'');

let DB = [], ROLE = 'pub', ROOMS = new Map();
const state = { q:'', c:'전체', g:'', view:'p' };
let RM = {};
const H = r => (RM[r] && RM[r].h) || String(r);
const PT = r => (RM[r] && RM[r].t) || '';

function start(data, role){
  ROLE = role;
  RM = data.meta.rooms || {};
  DB = data.people.map((p,i) => ({...p, id:i, cho:cho(p.n), hay:[p.c,p.o,p.d,p.t].join(' ').toLowerCase(), pd:digits(p.p||'')}));
  ROOMS = new Map();
  [...DB].sort((a,b)=>a.n.localeCompare(b.n,'ko')).forEach(p => { if(!ROOMS.has(p.r)) ROOMS.set(p.r, []); ROOMS.get(p.r).push(p); });
  ROOMS = new Map([...ROOMS].sort((a,b)=>a[0]-b[0]));
  $('#evTitle').textContent = data.meta.title + ' 방배정';
  $('#evSub').textContent = data.meta.sub;
  const tag = $('#modeTag'); tag.textContent = role==='mgr' ? '매니저' : '참여자'; tag.classList.toggle('mgr', role==='mgr');
  $('#q').placeholder = role==='mgr' ? '이름·초성·호실·전화끝자리' : '이름 · 초성(ㄱㅁㅇ) · 호실(720)';
  buildChips();
  $('#lock').hidden = true; $('#app').hidden = false;
  render();
  setTimeout(()=> $('#q').focus({preventScroll:true}), 50);
}
function lock(){
  DB = []; ROOMS = new Map(); $('#main').innerHTML=''; $('#q').value=''; state.q='';
  closeSheet(); $('#app').hidden = true; $('#lock').hidden = false; setMode(mode);
}
$('#lockBtn').onclick = lock;

function buildChips(){
  const order = ['서울청','중부청','인천청','대전청','광주청','대구청','부산청'];
  const cs = [...new Set(DB.map(p=>p.c))].sort((a,b)=>(order.indexOf(a)+99)%99-(order.indexOf(b)+99)%99 || a.localeCompare(b,'ko'));
  const n = c => DB.filter(p=>p.c===c).length;
  $('#chips').innerHTML =
    `<button class="chip" data-c="전체" aria-pressed="true" type="button">전체 ${DB.length}</button>` +
    cs.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="false" type="button">${esc(c)} ${n(c)}</button>`).join('') +
    `<span class="chip sep">|</span>` +
    `<button class="chip" data-g="남" aria-pressed="false" type="button">남</button><button class="chip" data-g="여" aria-pressed="false" type="button">여</button>`;
}
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b || b.classList.contains('sep')) return;
  if (b.dataset.c) state.c = b.dataset.c; else state.g = state.g===b.dataset.g ? '' : b.dataset.g;
  $('#chips').querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.c===state.c));
  $('#chips').querySelectorAll('[data-g]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.g===state.g));
  render();
});

function match(p, tokens){
  return tokens.every(t => {
    const ho = t.match(/^(\d{3})(호|호실)?$/);
    if (ho && (ho[2] || Object.values(RM).some(x=>x.h===ho[1]))) return H(p.r) === ho[1];
    if (ho && ROLE==='mgr') return p.pd.includes(ho[1]);
    const room = t.match(/^(\d{1,2})(번|호|방|번방|호실)?$/);
    if (room) return p.r === +room[1];
    if (ROLE==='mgr' && /^\d{3,}$/.test(t)) return p.pd.includes(t);
    if (isCho(t)) return p.cho.includes(t);
    return p.n.includes(t) || p.hay.includes(t.toLowerCase());
  });
}
function filtered(){
  const tokens = state.q.trim().split(/\s+/).filter(Boolean);
  return DB.filter(p => (state.c==='전체' || p.c===state.c) && (!state.g || p.g===state.g) && match(p, tokens));
}
function hl(name){
  const t = state.q.trim().split(/\s+/).find(t => t && name.includes(t));
  if (t) return esc(name).replace(esc(t), m=>`<mark>${m}</mark>`);
  const c = state.q.trim().split(/\s+/).find(t => isCho(t) && cho(name).includes(t));
  if (c){ const i = cho(name).indexOf(c); return esc(name.slice(0,i)) + '<mark>'+esc(name.slice(i,i+c.length))+'</mark>' + esc(name.slice(i+c.length)); }
  return esc(name);
}
const org = p => [p.c, p.o, p.t || p.d].filter(Boolean).join(' · ');
const gtag = g => g ? `<span class="g ${g==='남'?'m':'f'}">${esc(g)}</span>` : '';
const tel = p => digits(p.p);

function personRow(p, inSheet){
  const phone = ROLE==='mgr' && p.p ? `<div class="pphone num">${esc(p.p)}</div>` : '';
  const acts = ROLE==='mgr' && p.p ? `<div class="acts">
      <a class="ic" href="sms:${tel(p)}" aria-label="${esc(p.n)} 문자" data-stop>${ICON.sms}</a>
      <a class="ic call" href="tel:${tel(p)}" aria-label="${esc(p.n)} 전화" data-stop>${ICON.call}</a></div>` : '';
  const rank = ROLE==='mgr' && p.k ? ` · ${esc(p.k)}` : '';
  return `<div class="person${inSheet!==undefined && inSheet===p.id ? ' me':''}" ${inSheet!==undefined?'':`role="button" tabindex="0" data-id="${p.id}"`}>
    <div class="roomtag"><b>${H(p.r)}</b><small>호</small></div>
    <div class="pinfo"><div class="pname"><span>${hl(p.n)}</span>${gtag(p.g)}</div><div class="porg">${esc(org(p))}${rank}</div>${phone}</div>
    ${acts}</div>`;
}

function render(){
  const list = filtered();
  const main = $('#main');
  $('#clr').hidden = !state.q;
  if (state.view==='p'){
    const sorted = [...list].sort((a,b)=>a.n.localeCompare(b.n,'ko'));
    const roomQ = /^\d{1,2}(번|호|방|번방|호실)?$/.test(state.q.trim());
    let head = `<p class="count"><span>${sorted.length}명${state.q?` · “${esc(state.q.trim())}”`:''}</span><span>가나다순</span></p>`;
    if (!state.q && ROLE==='pub') head = `<p class="hint">내 이름을 검색하면 호실과 같은 방 사람이 나와요. 숙소는 소노벨 단양 East동이에요. 이름 첫 글자 초성만 눌러도 돼요 (예: ㅇㅈㅎ).</p>` + head;
    if (!state.q && ROLE==='mgr') head = `<p class="hint">전화 버튼이 안 열리면 번호를 길게 눌러 복사하세요. 사람을 누르면 같은 방 전체 번호를 볼 수 있어요.</p>` + head;
    main.innerHTML = head + (sorted.length
      ? `<div class="list">${sorted.map(p=>personRow(p)).join('')}</div>`
      : `<div class="empty"><b>찾는 사람이 없어요</b>이름 철자나 필터(청·성별)를 확인해 주세요.</div>`);
    if (roomQ && sorted.length) { /* 방번호 검색이면 바로 방 시트를 띄우지 않고 목록 유지 */ }
  } else {
    const ids = new Set(list.map(p=>p.id));
    const rooms = [...ROOMS].filter(([r,ps]) => ps.some(p=>ids.has(p.id)));
    main.innerHTML = `<p class="count"><span>방 ${rooms.length}개 · ${list.length}명</span><span>호실순</span></p>` + (rooms.length
      ? `<div class="rooms">${rooms.map(([r,ps])=>{
          const gs=[...new Set(ps.map(p=>p.g))].join('·');
          return `<button class="rcard" data-room="${r}" type="button"><div class="rh"><span class="rn">${H(r)}<small>호</small></span><span class="rm">${esc(gs)} ${ps.length}명</span></div>
            <div class="names">${ps.map(p=> ids.has(p.id) && state.q ? `<mark>${esc(p.n)}</mark>` : esc(p.n)).join(', ')}</div></button>`;}).join('')}</div>`
      : `<div class="empty"><b>해당하는 방이 없어요</b>검색어나 필터를 바꿔 보세요.</div>`);
  }
}

let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer=setTimeout(()=>{ state.q=e.target.value; render(); }, 60); });
$('#q').addEventListener('keydown', e => { if(e.key==='Enter'){ e.target.blur(); } });
$('#clr').onclick = () => { $('#q').value=''; state.q=''; render(); $('#q').focus(); };
function setView(v){ state.view=v; $('#tab-p').setAttribute('aria-selected', v==='p'); $('#tab-r').setAttribute('aria-selected', v==='r'); render(); }
$('#tab-p').onclick = () => setView('p');
$('#tab-r').onclick = () => setView('r');

$('#main').addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return;
  const p = e.target.closest('[data-id]'); if (p){ const x=DB[+p.dataset.id]; openRoom(x.r, x.id); return; }
  const r = e.target.closest('[data-room]'); if (r) openRoom(+r.dataset.room);
});
$('#main').addEventListener('keydown', e => { if(e.key==='Enter'){ const p=e.target.closest('[data-id]'); if(p){ const x=DB[+p.dataset.id]; openRoom(x.r, x.id);} } });

/* ---------- 방 시트 ---------- */
let lastFocus;
function openRoom(r, meId){
  const ps = ROOMS.get(r) || [];
  lastFocus = document.activeElement;
  $('#shTitle').innerHTML = `<span class="num">${H(r)}</span>호`;
  const gs=[...new Set(ps.map(p=>p.g))].join('·');
  $('#shMeta').textContent = [`East동 ${H(r)}호`, PT(r), `${gs} ${ps.length}명`.trim(), [...new Set(ps.map(p=>p.c))].join(', ')].filter(Boolean).join(' · ');
  $('#shBody').innerHTML = `<div class="list">${[...ps].sort((a,b)=>(b.id===meId)-(a.id===meId)).map(p=>personRow(p, meId ?? -1)).join('')}</div>`;
  if (ROLE==='mgr'){
    const nums = ps.filter(p=>p.p).map(p=>tel(p));
    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
    const groupSms = isIOS ? `sms:/open?addresses=${nums.join(',')}` : `sms:${nums.join(',')}`;
    $('#shFoot').innerHTML = `<button class="btn" id="cpAll" type="button">번호 전체 복사</button><a class="btn pri" href="${groupSms}">방 전체 문자</a>`;
    $('#cpAll').onclick = () => copy(ps.map(p=>`${p.n} ${p.p}`).join('\n'), `${H(r)}호 ${ps.length}명 번호 복사됨`);
  } else $('#shFoot').innerHTML = '';
  $('#scrim').hidden = false; $('#sheet').hidden = false;
  $('#shClose').focus();
}
function closeSheet(){ $('#scrim').hidden = true; $('#sheet').hidden = true; if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
$('#scrim').onclick = closeSheet; $('#shClose').onclick = closeSheet;
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

/* ---------- 복사 ---------- */
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(el._t); el._t=setTimeout(()=>el.hidden=true, 1800); }
function copy(text, ok){
  const fallback = () => { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    let done=false; try{ done=document.execCommand('copy'); }catch(e){} ta.remove(); toast(done ? ok : '복사가 막혀 있어요. 번호를 길게 눌러 복사하세요'); };
  try { navigator.clipboard.writeText(text).then(()=>toast(ok), fallback); } catch(e){ fallback(); }
}
</script>
